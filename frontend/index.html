<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Analytics</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Student Analytics</h1>

    <section class="stats">

        <div class="card">
            <h3>Moyenne générale</h3>
            <p id="general-average">--</p>
        </div>

        <div class="card">
            <h3>Meilleur étudiant</h3>
            <p id="best-student">--</p>
        </div>

        <div class="card">
            <h3>Étudiant le plus faible</h3>
            <p id="worst-student">--</p>
        </div>

    </section>

    <h2>Moyenne par etudiant</h2>
    <ul id="list">
    </ul>

    <script src="app.js"></script>
</body>
</html>
